<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Wi-Fi Setup</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .title-container {
        display: flex;
        align-items: center;
        flex: 1;
      }

      .toggle-icon {
        display: inline-block;
        margin-left: 8px;
        transition: transform 0.3s;
        font-size: 18px;
        color: #718096;
      }

      .toggle-icon.collapsed {
        transform: rotate(-90deg);
      }

      .card-content {
        max-height: 1000px;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
      }

      .card-content.collapsed {
        max-height: 0;
      }

      ul {
        list-style: none;
      }

      li {
        padding: 12px;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: background 0.2s;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      li:last-child {
        border-bottom: none;
      }

      li:hover {
        background: #f7fafc;
      }

      li:active {
        background: #e2e8f0;
      }

      .now-mac {
        color: #4a5568;
        font-family: monospace;
        font-size: 13px;
      }

      .now-last-msg {
        color: #718096;
        font-size: 12px;
        margin-top: 4px;
      }

      .pair-btn {
        background: #48bb78;
        color: white;
        border: none;
        padding: 6px 16px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
        font-weight: 500;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .pair-btn:hover {
        background: #38a169;
      }

      .pair-btn:active {
        transform: scale(0.95);
        background: #2f855a;
      }

      .unpair-btn {
        background: #f56565;
        color: white;
        border: none;
        padding: 6px 16px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s;
        font-weight: 500;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .unpair-btn:hover {
        background: #e53e3e;
      }

      .unpair-btn:active {
        transform: scale(0.95);
        background: #c53030;
      }

      /* LOADING */
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .title-loading {
        display: inline-block;
        border: 2px solid #e2e8f0;
        border-top: 2px solid #667eea;
        border-radius: 50%;
        width: 16px;
        height: 16px;
        animation: spin 1s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
        flex-shrink: 0;
      }

      .title-loading.hidden {
        visibility: hidden;
      }

      .status-badge {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .status-badge.paired {
        background: #48bb78;
        box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.2);
      }

      .status-badge.unpaired {
        background: #cbd5e0;
      }

      .device-paired {
        background: #f0fff4;
        border-left: 3px solid #48bb78;
      }

      .device-unpaired {
        background: white;
      }

      .network-info {
        flex: 1;
        font-size: 14px;
      }

      /* TREE */
      .tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .node {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            z-index: 10;
        }

        .node:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .root-node {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 16px;
        }

        .leaf-node {
            background: white;
            border: 2px solid #e0e0e0;
        }

        .leaf-node.paired {
            border-color: #4caf50;
            background: linear-gradient(to right, #ffffff, #f1f8f4);
        }

        .leaf-node.unpaired {
            border-color: #ff9800;
            background: linear-gradient(to right, #ffffff, #fff8f0);
            opacity: 0.7;
        }

        .branch-container.unpaired .branch-line {
            display: none;
        }

        .branch-container.unpaired {
            padding-top: 0;
            margin-top: 60px;
        }

        .mac {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: 600;
        }

        .details {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.8;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
        }

        .paired-badge {
            background: #4caf50;
            color: white;
        }

        .unpaired-badge {
            background: #ff9800;
            color: white;
        }

        .rssi {
            font-weight: 600;
            color: #666;
        }

        .connector-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .connected-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 40px;
        }

        .disconnected-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 40px;
            border-top: 2px dashed #ccc;
            margin-top: 40px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #999;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .disconnected-devices {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .vertical-line {
            width: 4px;
            height: 60px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            position: relative;
        }

        .vertical-line::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        .horizontal-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .horizontal-line {
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            position: absolute;
            top: 0;
            border-radius: 2px;
        }

        .branch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 20px;
        }

        .branch-line {
            width: 4px;
            height: 40px;
            background: linear-gradient(180deg, #764ba2 0%, #667eea 100%);
            border-radius: 2px;
            position: relative;
        }

        .branch-line::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #764ba2;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.2);
        }

        .children {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            position: relative;
            padding-top: 40px;
        }

        .signal-strength {
            display: inline-flex;
            gap: 2px;
            margin-left: 8px;
            align-items: flex-end;
        }

        .signal-bar {
            width: 3px;
            background: currentColor;
            border-radius: 2px;
        }

        .signal-bar:nth-child(1) { height: 6px; }
        .signal-bar:nth-child(2) { height: 9px; }
        .signal-bar:nth-child(3) { height: 12px; }
        .signal-bar:nth-child(4) { height: 15px; }

        .excellent { color: #4caf50; }
        .good { color: #8bc34a; }
        .fair { color: #ff9800; }
        .poor { color: #f44336; }
    </style>
  </head>
  <body>
    <div class="container">
      
      <div class="card">
        <div class="card-header">
          <div id="titleInfo" class="title-container"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
        <div id="tree" class="tree"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="title-container">
            <span id="nowLoader" class="title-loading hidden"></span>
            <h2 style="margin: 0">ESP-NOW Devices</h2>
            <span id="nowToggle" class="toggle-icon">▼</span>
          </div>
        </div>
        <div id="nowContent" class="card-content">
          <ul id="listNow">
            <li class="empty-state">Scanning devices...</li>
          </ul>
        </div>
      </div>
    </div>

    <script src="now.js"></script>
    <script src="index.js"></script>
  </body>
</html>
